<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}{% endblock %} - ハム大まめちしき</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="bg-light py-3">
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="{{ url_for('index') }}">ハム大まめちしき</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">トップ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'article_list' %}active{% endif %}" href="{{ url_for('article_list') }}">記事一覧</a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main class="container my-4">
    <div class="row">
      <div class="col-md-8">
        {% block content %}{% endblock %}
      </div>
      <div class="col-md-4">
        <aside class="sidebar">
          <h2>週間人気ランキング</h2>
          <ol class="list-group list-group-numbered">
            {% for article in trend_articles %}
              <li class="list-group-item"><a href="{{ url_for('article', article_id=article.id) }}">{{ article.title }}</a></li>
            {% endfor %}
          </ol>

          <h2 class="mt-4">タグ一覧</h2>
          <ul class="list-group">
            {% for tag in tags %}
              <li class="list-group-item"><a href="{{ url_for('tag', tag_id=tag.id) }}">{{ tag.name }}</a></li>
            {% endfor %}
          </ul>
        </aside>
      </div>
    </div>
  </main>

  <footer class="bg-light py-3 mt-4">
    <div class="container">
      <p class="text-center">&copy; 2024 ハム大まめちしき</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
